services:
  schichtplaner-web:
    build: .
    image: schichtplaner-web:2026.07.21-pdf
    container_name: schichtplaner-web
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=schichtplaner-db;Port=5432;Database=${POSTGRES_DB:-schichtplaner};Username=${POSTGRES_USER:-schichtplaner};Password=${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      SeedAdmin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL muss gesetzt sein}
      SeedAdmin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}
      UseHttpsRedirection: "false"
      DataProtection__KeysPath: /app/keys
    volumes:
      - schichtplaner_keys:/app/keys
    depends_on:
      schichtplaner-db:
        condition: service_healthy

  schichtplaner-db:
    image: postgres:16
    container_name: schichtplaner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schichtplaner}
      POSTGRES_USER: ${POSTGRES_USER:-schichtplaner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  schichtplaner_keys:
